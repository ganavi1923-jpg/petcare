<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | PetCare Connect</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/site-theme.css" />
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4">Set a new password</h1>
        <div id="resetMessage" class="alert d-none" role="status" aria-live="polite"></div>
        <form id="resetForm">
          <label class="form-label" for="newPassword">New password</label>
          <input class="form-control mb-3" id="newPassword" type="password" autocomplete="new-password" minlength="6" required />
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input class="form-control mb-3" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
          <button class="btn btn-primary w-100" id="resetSubmit" type="submit">Update password</button>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=reset-password"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('resetMessage');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        message.className = 'alert alert-danger';
        return;
      }
      const submit = document.getElementById('resetSubmit');
      submit.disabled = true;
      const result = await window.PawCareAuth.updatePassword(newPassword);
      if (result.success) {
        message.innerHTML = `${result.message} <a href="login.html" class="alert-link">Log in</a>`;
        message.className = 'alert alert-success';
      } else {
        message.textContent = result.error;
        message.className = 'alert alert-danger';
      }
      submit.disabled = false;
    });
  </script>
</body>
</html>
